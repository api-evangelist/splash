name: Splash
description: >-
  Splash is an AI music-creation platform building games and tools for a new
  generation of creators. Developed by the team formerly known as Popgun AI, it
  has built proprietary generative-audio technology and high-quality music
  datasets since 2017, powering features such as Text-to-Singing, Text-to-Rap,
  and Generative Text-to-Music. Splash's consumer products include the Splash
  beat-maker app for iOS and Android, SPLASH on Roblox, the WeMix collaborative
  music experience, and KAIMIX. The company is backed by Khosla Ventures,
  Techstars, the Alexa Fund, Bitkraft, King River Capital, and Mawson. Splash
  publishes no public developer API or documentation surface at this time; this
  profile captures its public web identity in the API Evangelist network.
